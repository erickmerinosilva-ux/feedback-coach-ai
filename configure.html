<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configurar Feedback Coach AI</title>
  <script src="https://res.cdn.office.net/teams-js/2.40.0/js/MicrosoftTeams.min.js"></script>
  <style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;padding:24px;color:#15251d;background:#f3f6f4}.card{max-width:560px;background:white;border:1px solid #d8e2dc;border-radius:14px;padding:20px}h2{margin-top:0}.ok{color:#2f7a4c;font-weight:700}</style>
</head>
<body>
  <div class="card">
    <h2>Feedback Coach AI</h2>
    <p class="ok" id="readyText">La aplicación está lista para agregarse.</p>
    <p id="contextText">Selecciona <b>Guardar</b> en Teams para continuar.</p>
  </div>
  <script>
    (async function(){
      try {
        await microsoftTeams.app.initialize();
        const ctx = await microsoftTeams.app.getContext();
        const fc = ctx && ctx.page ? (ctx.page.frameContext || '') : '';
        const labels = {
          channelTab: 'este canal',
          privateChatTab: 'este chat grupal',
          meetingChatTab: 'el chat de esta reunión',
          meetingDetailsTab: 'esta reunión',
          meetingSidePanel: 'el panel de esta reunión',
          meetingStage: 'el escenario de esta reunión'
        };
        document.getElementById('readyText').textContent = 'Feedback Coach AI está listo para agregarse a ' + (labels[fc] || 'Teams') + '.';
        const base = new URL('.', window.location.href).href.replace(/\/$/, '');
        const entityId = 'feedback-coach-ai-' + (ctx && ctx.page && ctx.page.id ? ctx.page.id : Date.now());

        microsoftTeams.pages.config.registerOnSaveHandler(async function(saveEvent){
          try {
            await microsoftTeams.pages.config.setConfig({
              websiteUrl: base + '/index.html',
              contentUrl: base + '/index.html',
              entityId: entityId,
              suggestedDisplayName: 'Feedback Coach AI'
            });
            saveEvent.notifySuccess();
          } catch (e) {
            console.error('Teams setConfig failed', e);
            saveEvent.notifyFailure('No se pudo configurar Feedback Coach AI.');
          }
        });
        microsoftTeams.pages.config.setValidityState(true);
      } catch (e) {
        console.error('Teams initialization failed', e);
        document.getElementById('readyText').textContent = 'No se pudo iniciar la integración con Microsoft Teams.';
        document.getElementById('contextText').textContent = 'Cierra esta ventana y vuelve a abrir la configuración desde Teams.';
      }
    })();
  </script>
</body>
</html>
