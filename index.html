<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback Coach AI</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://res.cdn.office.net/teams-js/2.40.0/js/MicrosoftTeams.min.js"></script>
</head>
<body style="margin:0">
  <div id="fc-root"><div class="app">
<aside class="side">
  <div class="brand"><div class="logo">FC</div><div><h1>Feedback Coach AI</h1><small>Bitácora de Talento</small></div></div>
  <div class="nav" id="nav"></div>
  <div class="sideBottom"><small>Sesión actual</small><div id="signedUser" class="mini">Usuario de Teams</div><div class="mini" style="opacity:.65;margin-top:4px">Feedback Coach AI</div></div>
</aside>
<main class="main">
<header class="top"><div><h2 id="title">Dashboard</h2><p id="subtitle"></p></div><div class="topActions"><span id="teamsContextPill" class="pill hidden"></span><button id="shareStageBtn" class="btn agent sm hidden" type="button">Compartir en escenario</button></div></header>
<section class="content" id="view"></section>
</main>
</div></div>
  <script src="./app.js"></script>
  <script>
    async function detectTeams() {
      if (window.parent === window.self || !window.microsoftTeams) return null;
      try {
        const init = microsoftTeams.app.initialize();
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Teams init timeout')), 5000));
        await Promise.race([init, timeout]);
        return await microsoftTeams.app.getContext();
      } catch (e) {
        console.warn('Teams context unavailable; running as standalone web.', e);
        return null;
      }
    }

    function labelForContext(frameContext) {
      const labels = {
        personalTab: 'Teams · Personal',
        channelTab: 'Teams · Canal',
        privateChatTab: 'Teams · Chat grupal',
        meetingChatTab: 'Teams · Chat de reunión',
        meetingDetailsTab: 'Teams · Detalles de reunión',
        meetingSidePanel: 'Teams · Panel de reunión',
        meetingStage: 'Teams · Escenario'
      };
      return labels[frameContext] || 'Microsoft Teams';
    }

    async function shareToMeetingStage() {
      const btn = document.getElementById('shareStageBtn');
      if (!window.microsoftTeams || !microsoftTeams.meeting) return;
      const appContentUrl = new URL('./index.html?stage=1', window.location.href).href;
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = 'Compartiendo…';
      try {
        await new Promise(function(resolve, reject) {
          microsoftTeams.meeting.shareAppContentToStage(function(err, result) {
            if (err) reject(err);
            else if (result) resolve(result);
            else reject(new Error('Teams no confirmó el uso compartido al escenario.'));
          }, appContentUrl);
        });
        btn.textContent = 'Compartido ✓';
        setTimeout(function(){ btn.textContent = oldText; btn.disabled = false; }, 2200);
      } catch (e) {
        console.error('Share to stage failed', e);
        btn.textContent = 'Reintentar compartir';
        btn.disabled = false;
        alert('No se pudo compartir al escenario. Verifica que estés dentro de una reunión activa y que la app tenga el permiso MeetingStage.Write.Chat.');
      }
    }

    window.__teamsReady = detectTeams();
    window.__teamsReady.then(function(ctx) {
      const frameContext = ctx && ctx.page ? (ctx.page.frameContext || '') : '';
      const meetingId = ctx && ctx.meeting ? (ctx.meeting.id || '') : '';
      window.__teamsContext = ctx || null;

      const contextPill = document.getElementById('teamsContextPill');
      const shareBtn = document.getElementById('shareStageBtn');
      if (ctx && contextPill) {
        contextPill.textContent = labelForContext(frameContext);
        contextPill.classList.remove('hidden');
      }
      if (ctx && frameContext === 'meetingSidePanel' && shareBtn) {
        shareBtn.classList.remove('hidden');
        shareBtn.addEventListener('click', shareToMeetingStage);
      }

      mountFeedbackCoach(document.getElementById('fc-root'), {
        isTeams: !!ctx,
        frameContext: frameContext,
        meetingId: meetingId,
        teamId: ctx && ctx.team ? (ctx.team.groupId || '') : '',
        channelId: ctx && ctx.channel ? (ctx.channel.id || '') : '',
        chatId: ctx && ctx.chat ? (ctx.chat.id || '') : '',
        userName: ctx && ctx.user ? (ctx.user.displayName || ctx.user.userPrincipalName || '') : ''
      });
    });
  </script>
</body>
</html>
